<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>welcome Jay</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light dark; --scene-background: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --scene-background: #181818; } }
    :root[data-appearance="light"] { color-scheme: light; --scene-background: #ffffff; }
    :root[data-appearance="dark"] { color-scheme: dark; --scene-background: #181818; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--scene-background); }
    canvas { display: block; width: 100%; height: 100%; background: var(--scene-background); }
  </style>
</head>
<body>
  <canvas aria-label="welcome Jay"></canvas>
  <script src="knot-paths.js"></script>
  <script src="animation.js"></script>
</body>
</html>
